name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v7.6.0
      # No project sync: ruff is pinned in the dev group and needs nothing else,
      # so this row stays green when a dependency resolution is what is broken.
      - name: Lint
        run: uv run --only-group dev ruff check every_eval_ever tests scripts

  tests:
    name: ${{ matrix.deps }} / ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: core
            resolution: locked
            sync: uv sync --locked
            pytest_args: tests -v
          - deps: core
            resolution: loose
            sync: uv sync --upgrade
            pytest_args: tests -v
          - deps: full
            resolution: locked
            sync: uv sync --locked --all-extras
            pytest_args: tests -v
          - deps: full
            resolution: loose
            sync: uv sync --upgrade --all-extras
            pytest_args: tests -v
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v7.6.0
      - name: Install dependencies
        # Keep installed dependencies outside the checkout. NLTK's import
        # security intentionally blocks dependency imports resolved beneath CWD.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/eee-venv
        run: ${{ matrix.sync }}
      - name: Run tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/eee-venv
        run: uv run pytest ${{ matrix.pytest_args }}
